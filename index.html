<!DOCTYPE html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Título y descripción por ruta: los pone el router (src/content/copy.ts → SEO).
         Estos son los valores de la carga inicial (lo que leen los bots sin JS). -->
    <title>DISKRET | Diseñamos tu casa completa, de principio a fin</title>
    <meta name="description" content="Diseñamos, remodelamos, decoramos y fabricamos los muebles de tu casa con un solo equipo y una sola visión. Mira cómo trabaja el Método Diskret." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#34485a" />

    <!-- Meta Pixel: lo inyecta vite.config.ts (plugin metaPixel) con META_PIXEL_ID de
         src/config/funnel.ts. Vacío = sin pixel. No carga en localhost. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Open Graph. og:image debe ser una URL ABSOLUTA del dominio final (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="DISKRET" />
    <meta property="og:title" content="DISKRET | Diseñamos tu casa completa, de principio a fin" />
    <meta property="og:description" content="Diseñamos, remodelamos, decoramos y fabricamos los muebles de tu casa con un solo equipo y una sola visión. Mira cómo trabaja el Método Diskret." />
    <meta property="og:image" content="https://diskret-landing.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
